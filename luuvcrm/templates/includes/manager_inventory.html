.mi-live-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:#9c6e29;white-space:nowrap}.mi-live-status:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.mi-live-status.connected{color:#278253}.mi-order-summary{border:1px solid #ecc1b9;background:#fff6f2;border-radius:15px;padding:18px 20px;margin-bottom:24px}.mi-order-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.mi-order-head h2{color:#a8372d;font-size:18px;margin:0}.mi-order-head span{font-size:12px;color:#ab5f51}.mi-order-items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mi-order-item{background:#fff;border:1px solid #f1d9d2;border-radius:10px;padding:12px;min-width:0}.mi-order-item strong{display:block;font-size:13px;margin-bottom:7px}.mi-order-item p{font-size:11px;margin:0;line-height:1.6}.mi-order-item b{display:block;color:#b23b30;font-size:12px;margin-top:6px;font-weight:650}.mi-order-clear{background:#f2f8f0;border-color:#dcebd6;color:#407940}.mi-order-clear .mi-order-head{margin:0}.mi-order-clear .mi-order-head h2{color:#407940}.mi-stock-art{position:relative}.mi-stock-delta{position:absolute;right:16px;top:8px;font-size:12px;font-weight:750;padding:5px 8px;border-radius:7px;background:#ffebe5;color:#b24132;z-index:1}.mi-stock-delta.increase{color:#27784a;background:#e8f5e9}.mi-stock-card.changed{animation:miStockFlash 1.3s ease-out}.mi-stock-meter>span{transition:width .35s ease}.mi-graph-header{display:none}.mi-graphs-only>.mi-head,.mi-graphs-only>.mi-tabs,.mi-graphs-only .mi-stock-intro,.mi-graphs-only #miOrderSummary,.mi-graphs-only #miStockSearch,.mi-graphs-only #miLowFilter,.mi-graphs-only .mi-stock-category{display:none}.mi-graphs-only .mi-graph-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.mi-graphs-only .mi-graph-header h2{font-size:25px;margin:0}.mi-graphs-only .mi-stock-tools{justify-content:flex-end}.mi-graphs-only .mi-stock-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.mi-graphs-only .mi-stock-top{min-height:64px;padding:16px 16px 0}.mi-graphs-only .mi-stock-top h3{font-size:14px;min-height:36px}.mi-graphs-only .mi-stock-minimum{cursor:default;display:inline-block}.mi-graphs-only .mi-stock-amount{padding:0 16px 12px}.mi-graphs-only .mi-stock-foot{padding:10px 16px}.mi-graphs-only .mi-stock-amount strong{font-size:27px}@keyframes miStockFlash{from{box-shadow:0 0 0 3px #ef9a6277}to{box-shadow:0 0 0 0 #ef9a6200}}@media(prefers-reduced-motion:reduce){.mi-stock-card.changed{animation:none}.mi-stock-meter>span{transition:none}}@media(max-width:1000px){.mi-order-items{grid-template-columns:repeat(2,minmax(0,1fr))}.mi-graphs-only .mi-stock-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.mi-graphs-only .mi-stock-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mi-order-summary{padding:15px}.mi-order-head{align-items:flex-start}.mi-order-head span{max-width:120px;text-align:right}.mi-order-item{padding:10px}.mi-order-item strong{font-size:12px}.mi-graphs-only .mi-graph-header h2{font-size:21px}.mi-stock-tools .mi-view{flex-wrap:wrap}.mi-stock-delta{font-size:10px;right:8px;top:2px}}

.mi-prep-usage{padding:12px 0;border-top:1px solid var(--line);margin-top:16px}.mi-prep-usage p{display:flex;justify-content:space-between;gap:12px;font-size:13px}.mi-prep-usage strong{white-space:nowrap;color:var(--ink)}.mi-prep-help{font-size:12px;margin-top:10px!important}.mi #miVersion{max-width:100%}.mi-history details{margin-top:8px;color:var(--muted);font-size:12px}.mi-history summary{cursor:pointer}

<script>
window.LFInventory=(()=>{
  const base='/api/method/luuvcrm.api.manager_inventory.';
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:4});
  let root,data,current,mode='stock',dirty=false,busy=false,loading=false,selected='',error='';
  let equipmentSearch='';
  let policyDraft=null,policyBranch='',policyDirty=false,ruleSearch='';
  const requestedView=new URLSearchParams(location.search).get('view');
  let stockView=['piles','list','graphs'].includes(requestedView)?requestedView:'piles',stockSearch='',onlyLow=false;
  let stream=null,streamUrl='',connected=false,pendingRefresh=false,lastSnapshot=0,changeTimer,reconnectTimer;
  let changes=new Map();
  async function call(method,payload={}){
    const token=document.querySelector('meta[name="csrf-token"]')?.content||'';
    const response=await fetch(base+method,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Frappe-CSRF-Token':token},body:new URLSearchParams(payload)});
    const body=await response.json();
    if(!response.ok||body.exc||body.error){let msg=body.error||'Request failed';try{msg=JSON.parse(JSON.parse(body._server_messages)[0]).message}catch(e){}throw Error(msg.replace(/<[^>]*>/g,''));}
    return body.message;
  }
  function init(){
    if(root)return;
    root=document.getElementById('tabInventory');root.classList.add('mi');
    root.innerHTML='<div class="mi-head"><div><h1>Inventory</h1><p id="miBranch">Branch stock & recipes</p></div><div class="mi-fields"><span class="mi-live-status" data-live-status>Connecting</span><button class="mi-btn" id="miRefresh">↻ Refresh</button></div></div><div class="mi-tabs"><button data-mode="stock">Running stock</button><button data-mode="equipment">Main inventory</button><button data-mode="recipes">Recipes</button><button data-mode="audits">Audit history</button><button data-mode="rules">Stock rules</button></div><div id="miError"></div><div id="miContent"></div><p class="mi-status" id="miUpdated"></p>';
    root.querySelector('#miRefresh').onclick=()=>load();
    root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
    const dialog=document.createElement('dialog');dialog.id='miAudit';dialog.className='mi mi-dialog';document.body.appendChild(dialog);
    // Push updates are primary. Refresh only for reconnect fallback or a
    // periodic reconciliation; a missed event must never leave stale stock.
    setInterval(()=>{if(!document.hidden&&root.offsetParent!==null&&(!connected||Date.now()-lastSnapshot>60000))load(true)},5000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&root.offsetParent!==null)load(true)});
    window.addEventListener('online',()=>{connectStream(data?.realtime);load(true)});
    window.addEventListener('offline',()=>{clearTimeout(reconnectTimer);stream?.close();stream=null;streamUrl='';setLive(false)});
    window.addEventListener('pagehide',()=>{clearTimeout(reconnectTimer);stream?.close();stream=null;streamUrl='';setLive(false)});
    window.addEventListener('pageshow',()=>{if(root&&data)connectStream(data.realtime)});
    window.addEventListener('beforeunload',e=>{if(dirty||policyDirty){e.preventDefault();e.returnValue=''}});
  }
  async function load(quiet=false){
    init();if(loading){pendingRefresh=true;return}loading=true;
    try{
      const next=await call('dashboard'),previous=data?.restaurant===next.restaurant?new Map(data.stock.map(r=>[r.item,Number(r.balance)])):new Map();
      let changed=false;
      for(const r of next.stock){if(previous.has(r.item)){const delta=Math.round((Number(r.balance)-previous.get(r.item))*1e6)/1e6;if(delta){changes.set(r.item,{delta,until:Date.now()+4500});changed=true}}}
      if(changed){clearTimeout(changeTimer);changeTimer=setTimeout(()=>{changes.clear();if(mode==='stock'&&root.querySelector('#miStockRows'))stockRows()},4600)}
      data=next;error='';lastSnapshot=Date.now();
      if(quiet&&mode==='stock'&&root.querySelector('#miStockRows')){stockRows();showError()}else if(quiet&&mode==='equipment'&&root.querySelector('#miEquipmentRows')){equipmentRows();showError()}else if(!quiet||!['recipes','rules'].includes(mode))render();
      connectStream(data.realtime);liveStatus();
      root.querySelector('#miBranch').textContent=data.restaurant+' · '+data.warehouse;
      root.querySelector('#miUpdated').textContent='Updated '+new Date().toLocaleTimeString()+(connected?' · changes appear instantly':' · reconnecting; stock is checked automatically');
    }
    catch(e){error=e.message;showError();if(stream?.readyState!==EventSource.OPEN)setLive(false)}finally{loading=false;if(pendingRefresh){pendingRefresh=false;queueMicrotask(()=>load(true))}}
  }
  function liveStatus(){root?.querySelectorAll('[data-live-status]').forEach(s=>{s.classList.toggle('connected',connected);s.textContent=connected?'Live':data&&!data.realtime?'Auto-refresh · 5s':'Reconnecting'})}
  function setLive(value){connected=value;liveStatus()}
  function connectStream(config){
    if(config?.transport!=='sse'||!window.EventSource||!navigator.onLine)return;
    const url=new URL(config.url,location.origin);if(url.origin!==location.origin)return;
    if(stream&&streamUrl===url.href&&stream.readyState!==EventSource.CLOSED)return;
    stream?.close();streamUrl=url.href;stream=new EventSource(url.href);
    stream.addEventListener('ready',()=>{clearTimeout(reconnectTimer);setLive(true);load(true)});
    stream.addEventListener('stock',()=>{setLive(true);load(true)});
    stream.onerror=()=>{setLive(false);clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{if(!connected&&navigator.onLine){stream?.close();stream=null;streamUrl='';connectStream(data?.realtime)}},1500)};
  }
  function showError(){root.querySelector('#miError').innerHTML=error?'<div class="mi-error">'+escape(error)+'</div>':''}
  function render(){
    root.classList.toggle('mi-graphs-only',mode==='stock'&&stockView==='graphs');
    root.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));showError();
    if(!data)return;const content=root.querySelector('#miContent');
    if(mode==='stock'){
      content.innerHTML='<div class="mi-graph-header"><h2>'+escape(data.restaurant)+' · Stock</h2><span class="mi-live-status" data-live-status>Connecting</span></div><section id="miOrderSummary"></section><div class="mi-stock-intro"><div><h2>Your stock, at a glance</h2><p>Live quantities in each item’s defined unit. Red means at or below MOQ.</p></div><button class="mi-btn mi-primary" id="miNewIngredient">+ New ingredient</button></div><div class="mi-stock-tools"><input id="miStockSearch" placeholder="Search stock…" aria-label="Search ingredients"><button class="mi-attention" id="miLowFilter"></button><div class="mi-view" aria-label="Stock view"><button data-view="piles">▦ Piles</button><button data-view="list">☷ List</button><button data-view="graphs">◫ Graphs only</button></div></div><div id="miStockRows"></div>';
      const input=content.querySelector('#miStockSearch');input.value=stockSearch;input.oninput=()=>{stockSearch=input.value;stockRows()};
      content.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{stockView=b.dataset.view;const url=new URL(location.href);url.searchParams.set('view',stockView);history.replaceState(null,'',url);if(stockView==='graphs'){stockSearch='';onlyLow=false;input.value=''}stockRows()});
      content.querySelector('#miLowFilter').onclick=()=>{onlyLow=!onlyLow;stockRows()};content.querySelector('#miNewIngredient').onclick=()=>openNewIngredient(false);stockRows();
    }else if(mode==='equipment'){
      content.innerHTML='<div class="mi-stock-intro"><div><h2>Main inventory</h2><p>Reusable equipment, furniture and registered assets kept by this branch.</p></div></div><input class="mi-search" id="miEquipmentSearch" aria-label="Search main inventory" placeholder="Find equipment…"><p id="miEquipmentCount" style="margin-bottom:16px"></p><div id="miEquipmentRows" class="mi-stock-grid"></div>';
      const input=content.querySelector('#miEquipmentSearch');input.value=equipmentSearch;input.oninput=()=>{equipmentSearch=input.value;equipmentRows()};equipmentRows();
    }else if(mode==='recipes'){
      content.innerHTML='<div class="mi-grid"><div>'+(data.preparation_recipes?'<button class="mi-btn" id="miNewPrepared" style="width:100%;margin-bottom:12px">+ Prepared item recipe</button>':'')+'<input id="miMenuSearch" class="mi-search" placeholder="Search recipes…" aria-label="Search menu items"><div class="mi-menu" id="miMenu"></div></div><div class="mi-card" id="miEditor"><div class="mi-empty">Select an item to view its recipe.</div></div></div>';
      content.querySelector('#miMenuSearch').oninput=menuRows;menuRows();if(current)editor();
      if(data.preparation_recipes)content.querySelector('#miNewPrepared').onclick=openNewPrepared;
    }else if(mode==='rules'){rules();
    }else{
      content.innerHTML='<div class="mi-card"><h2>Stock count corrections</h2><p>Each correction is a new record. Past sales and stock movements stay unchanged.</p><div class="mi-history" style="margin-top:20px">'+(data.audits.length?data.audits.map(a=>{const d=a.details;return '<article><div class="mi-fields" style="justify-content:space-between"><strong>'+escape(d.name)+'</strong><span class="mi-pill">'+(d.difference>0?'+':'')+num(d.difference)+' '+escape(d.uom)+'</span></div><p>'+num(d.before)+' → '+num(d.counted)+' '+escape(d.uom)+'</p><p style="color:var(--ink)">'+escape(d.comment)+'</p><small>'+escape(a.owner)+' · '+escape(a.creation)+' · '+escape(a.name)+'</small></article>'}).join(''):'<div class="mi-empty">No corrections recorded yet.</div>')+'</div></div>';
    }
  }
  function equipmentRows(){
    const all=data.main_inventory||[],q=equipmentSearch.toLowerCase();
    const rows=all.filter(r=>(r.name+' '+r.equipment_category).toLowerCase().includes(q));
    root.querySelector('#miEquipmentCount').textContent=all.length+' equipment / asset records · quantities stay in their defined units';

  function stockStyle(r){
    const n=r.name.toLowerCase(),liquid=['l','litre','liter','ml','millilitre','milliliter'].includes(r.stock_uom.toLowerCase());
    if(liquid){if(n.includes('white'))return {kind:'liquid',color:'#e4cc90',shade:'#c1a265',tint:'#fcf7e9',category:'Sauces'};if(n.includes('hot'))return {kind:'liquid',color:'#dc6041',shade:'#b83e28',tint:'#fff0e9',category:'Sauces'};if(n.includes('oil'))return {kind:'liquid',color:'#e6ba35',shade:'#b58b20',tint:'#fff7d9',category:'Cooking'};return {kind:'liquid',color:'#e89951',shade:'#bf7034',tint:'#fff1e5',category:'Sauces'}}
    if(n.includes('potato'))return {kind:'potato',color:'#eac16a',shade:'#bc8a36',tint:'#fff5df',category:'Prepared food'};
    if(n.includes('chicken'))return {kind:'chicken',color:'#d99564',shade:'#ad6241',tint:'#fff0e6',category:'Prepared food'};
    if(n.includes('salad'))return {kind:'leaf',color:'#85b670',shade:'#4b854b',tint:'#edf6e8',category:'Prepared food'};
    if(n.includes('cheese'))return {kind:'cheese',color:'#efd797',shade:'#d3ac50',tint:'#fff9e7',category:'Dairy'};
    if(n.includes('flour'))return {kind:'powder',color:'#e3d6bf',shade:'#baaa8b',tint:'#f7f3eb',category:'Dry ingredients'};
    if(n.includes('cup'))return {kind:'cup',color:'#b9c8d5',shade:'#829cad',tint:'#eef4f7',category:'Packaging'};
    if(n.includes('fork'))return {kind:'fork',color:'#cca874',shade:'#a98450',tint:'#faf3e6',category:'Packaging'};
    if(r.stock_uom.toLowerCase()==='nos'||n.includes('box'))return {kind:'box',color:'#cb9a6d',shade:'#a7784d',tint:'#f8efe6',category:'Packaging'};
    return {kind:'powder',color:'#c9af87',shade:'#a78a5d',tint:'#f8f2e8',category:'Ingredients'};
  }

    }

      leaf:'<path d="M-13 7Q-17-13 2-11Q18-12 12 3Q8 14-13 7Z" fill="'+s.color+'" stroke="'+s.shade+'" stroke-width=".7"/><path d="M-10 7L8-7M-3 1L-6-6M2-3l8 2" stroke="#d8edb6" stroke-width="1.5"/>',
      cheese:'<path d="M-12-6L4-12L14-3V10L-2 14L-12 6Z" fill="'+s.color+'" stroke="'+s.shade+'" stroke-width=".7"/><path d="M-12-6L-2 1L14-3M-2 1v13" fill="none" stroke="'+s.shade+'" stroke-width=".7"/><circle cx="4" cy="6" r="2" fill="'+s.shade+'" opacity=".3"/>',
      powder:'<path d="M-15 8Q-13 2-9 1Q-5-13 2-10Q10-11 13 3L16 9Z" fill="'+s.color+'" stroke="'+s.shade+'" stroke-opacity=".3"/><path d="M-5-1Q0-7 4-3" fill="none" stroke="#fffaf1" stroke-width="3" stroke-linecap="round"/>',
      box:'<path d="M-13-7L1-12L14-6V8L0 13L-13 7Z" fill="'+s.color+'" stroke="'+s.shade+'" stroke-width="1"/><path d="M-13-7L0-1L14-6M0-1v14M-6-9L7-4" fill="none" stroke="'+s.shade+'"/><path d="M-5-9L8-4V0L-5-5Z" fill="#edcf99"/>',
      cup:'<path d="M-11-8L-8 10Q0 15 8 10L11-8Z" fill="'+s.color+'" stroke="'+s.shade+'" stroke-width=".7"/><ellipse cy="-8" rx="11" ry="4" fill="#eef4f7" stroke="'+s.shade+'" stroke-width=".7"/><path d="M-6-2l2 10" stroke="white" opacity=".6" stroke-width="2"/>',
      fork:'<path d="M-5-12v10Q-5 3 0 3Q5 3 5-2v-10M0-12v13M0 3v14" fill="none" stroke="'+s.color+'" stroke-width="3.5" stroke-linecap="round"/>'
    };
    let used=0,art='';[7,6,5,4,3].forEach((count,row)=>{for(let col=0;col<count;col++){

  function batchHistory(){
    root.querySelector('#miBatches').innerHTML='<h2>Completed batches</h2>'+((current.batches||[]).map(b=>{
      const d=b.details;return '<article><div class="mi-fields" style="justify-content:space-between"><strong>'+escape(b.name)+'</strong><span class="mi-pill green">+'+num(d.received_qty)+' '+escape(d.stock_uom)+'</span></div><p>'+num(d.planned_qty)+' '+escape(d.output_uom)+' recipe → '+num(d.actual_qty)+' '+escape(d.output_uom)+' finished</p>'+(d.comment?'<p>'+escape(d.comment)+'</p>':'')+'<small>'+escape(d.owner)+' · '+escape(new Date(b.creation).toLocaleString())+'</small><details><summary>Saved recipe & stock usage</summary><p>'+escape(d.recipe)+'</p>'+d.ingredients.map(i=>'<p>'+escape(i.name)+' · '+num(i.qty)+' '+escape(i.uom)+' used</p>').join('')+'<p>Finished stock: '+num(d.before)+' → '+num(d.after)+' '+escape(d.stock_uom)+'</p></details></article>';
    }).join('')||'<p>No batches completed yet.</p>');
  }
  function openBatch(){
    if(dirty||current.status!=='Active')return;
    const r=current,d=document.getElementById('miAudit'),requestId=crypto.randomUUID();d.className='mi mi-dialog';
    d.innerHTML='<h2>Complete batch · '+escape(r.name)+'</h2><p>Record this after the preparation is finished.</p><label for="miBatchPlanned">Amount prepared using this recipe ('+escape(r.output_uom)+')</label><input id="miBatchPlanned" type="number" min="0.001" step="'+(r.output_uom==='nos'?'1':'any')+'" value="'+Number(r.output_qty)+'"><div class="mi-prep-usage" id="miBatchUsage"></div><label for="miBatchActual">Finished quantity to add to stock ('+escape(r.output_uom)+')</label><input id="miBatchActual" type="number" min="0.001" step="'+(r.output_uom==='nos'?'1':'any')+'" value="'+Number(r.output_qty)+'"><p class="mi-prep-help">If the finished yield differs, enter the measured quantity. Ingredients follow the recipe amount above.</p><label for="miBatchComment">Batch note · required if the yield differs</label><textarea id="miBatchComment" rows="2" maxlength="1000" placeholder="e.g. Less salad after trimming"></textarea><div id="miAuditError"></div><div class="mi-actions"><button class="mi-btn" id="miAuditCancel">Cancel</button><button class="mi-btn mi-primary" id="miBatchComplete">Complete batch</button></div>';
    let actualEdited=false;
    const planned=d.querySelector('#miBatchPlanned'),actual=d.querySelector('#miBatchActual');
    const preview=()=>{const scale=Number(planned.value)/Number(r.output_qty);d.querySelector('#miBatchUsage').innerHTML='<p><b>Ingredients to use</b></p>'+r.ingredients.map(i=>'<p><span>'+escape(i.name)+'</span><strong>'+num(Number(i.qty)*scale)+' '+escape(i.uom)+'</strong></p>').join('')};
    planned.oninput=()=>{if(!actualEdited)actual.value=planned.value;preview()};actual.oninput=()=>{actualEdited=true};preview();
    d.querySelector('#miAuditCancel').onclick=()=>d.close();
    d.querySelector('#miBatchComplete').onclick=async()=>{
      const button=d.querySelector('#miBatchComplete');if(button.disabled)return;button.disabled=true;
      try{
        const result=await call('complete_batch',{item_code:r.item,version:r.version,request_id:requestId,planned_qty:planned.value,actual_qty:actual.value,comment:d.querySelector('#miBatchComment').value});
        current=await call('recipe',{item_code:r.item});data=await call('dashboard');d.close();editor();menuRows();
        const notice=document.createElement('div');notice.className='mi-success';notice.setAttribute('role','status');notice.textContent='Batch completed. '+result.item_name+' +'+num(result.received_qty)+' '+result.stock_uom;root.querySelector('#miEditor').prepend(notice);
      }catch(e){d.querySelector('#miAuditError').innerHTML='<div class="mi-error">'+escape(e.message)+'</div>'}finally{button.disabled=false}
    };d.showModal();planned.focus();
  }
  async function openRecipe(item,version){
    if(dirty&&!confirm('Discard the unsaved recipe changes?'))return;
    if(busy)return;busy=true;
    try{current=await call('recipe',{item_code:item,version:version||''});selected=item;dirty=false;error='';menuRows();editor()}catch(e){error=e.message;showError()}finally{busy=false}
  }
  function editor(){
    const r=current,old=r.version!==r.latest,prepared=r.kind==='prepared';
    root.querySelector('#miEditor').innerHTML='<div class="mi-head"><div><span class="mi-pill '+(r.status==='Active'?'green':'')+'">'+escape(old?'Historical version':r.status)+'</span><h2 style="margin-top:12px">'+escape(r.name)+'</h2><p>'+(prepared?'Make this item, then use it as an ingredient in other recipes.':'Ingredients for <strong>1 portion</strong>')+'</p></div></div>'+(prepared?'<div class="mi-fields" style="margin-bottom:16px"><label for="miOutputQty">This recipe makes</label><input id="miOutputQty" aria-label="Recipe output quantity" type="number" min="0.001" step="'+(r.output_uom==='nos'?'1':'any')+'" style="width:120px" value="'+Number(r.output_qty)+'" '+(old?'disabled':'')+'><strong>'+escape(r.output_uom)+'</strong></div>':'')+'<div class="mi-fields"><label for="miVersion">Version</label><select id="miVersion">'+(!r.version?'<option value="">New recipe</option>':'')+r.versions.map(v=>'<option value="'+escape(v.name)+'" '+(v.name===r.version?'selected':'')+'>'+escape(v.name)+' · '+(v.docstatus===1?'Published':'Draft')+'</option>').join('')+'</select></div><div class="mi-note">'+(old?'This version is read only. Select the latest version to make a new draft.':prepared?'Saving creates a new draft. Completing a batch consumes ingredients and adds finished stock. Past batches keep their saved recipe.':'Saving creates a new draft version. Activation applies to new orders; past orders and stock usage keep their original recipe.')+'</div><div id="miIngredients"></div><button class="mi-btn" id="miAdd" '+(old?'disabled':'')+'>+ Add ingredient</button> <button class="mi-btn" id="miNewRecipeIngredient" '+(old?'disabled':'')+'>+ New ingredient</button><div class="mi-actions"><span id="miDirty" style="margin-right:auto;align-self:center;color:var(--muted)"></span><button class="mi-btn" id="miSave" '+(old?'disabled':'')+'>Save new draft</button><button class="mi-btn mi-primary" id="miActivate" '+(old||r.status!=='Draft'||!r.version?'disabled':'')+'>Activate recipe</button></div><div id="miRecipeError"></div>'+(prepared?'<section style="border-top:1px solid var(--line);margin-top:24px;padding-top:20px"><div class="mi-head"><div><h2>Make a batch</h2><p>Finished stock: '+num(r.balance)+' '+escape(r.stock_uom)+'</p></div><button class="mi-btn mi-primary" id="miPrepare" '+(old||r.status!=='Active'||dirty?'disabled':'')+'>Complete batch</button></div><p>Record the batch after preparation is finished. Use '+escape(r.output_uom)+' when adding this item to another recipe.</p><div id="miBatches" class="mi-history" style="margin-top:20px"></div></section>':'');
    root.querySelector('#miVersion').onchange=e=>openRecipe(selected,e.target.value);
    root.querySelector('#miAdd').onclick=()=>{r.ingredients.push({item:'',qty:0,uom:''});setDirty();ingredientRows()};
    root.querySelector('#miNewRecipeIngredient').onclick=()=>openNewIngredient(true);root.querySelector('#miSave').onclick=saveRecipe;root.querySelector('#miActivate').onclick=activateRecipe;ingredientRows();
    if(prepared){
      root.querySelector('#miIngredients').insertAdjacentHTML('beforebegin','<label for="miRecipeNote" style="display:block;margin-top:12px">Recipe note</label><textarea id="miRecipeNote" rows="2" maxlength="1000" style="width:100%;margin-top:6px" '+(old?'disabled':'')+'>'+escape(r.recipe_note)+'</textarea>');
      root.querySelector('#miRecipeNote').oninput=e=>{r.recipe_note=e.target.value;setDirty()};
      root.querySelector('#miOutputQty').oninput=e=>{r.output_qty=e.target.value;setDirty()};root.querySelector('#miPrepare').onclick=openBatch;batchHistory()
    }
    if(dirty)setDirty();
  }
  function setDirty(){dirty=true;root.querySelector('#miDirty').textContent='Unsaved changes';root.querySelector('#miActivate').disabled=true;const prepare=root.querySelector('#miPrepare');if(prepare)prepare.disabled=true}
  function ingredientRows(){
    const old=current.version!==current.latest;
    root.querySelector('#miIngredients').innerHTML=current.ingredients.map((r,i)=>'<div class="mi-recipe-row"><select data-row="'+i+'" aria-label="Ingredient '+(i+1)+'" '+(old?'disabled':'')+'><option value="">Choose ingredient</option>'+current.catalog.filter(c=>c.item!==current.item).map(c=>'<option value="'+escape(c.item)+'" '+(r.item===c.item?'selected':'')+'>'+escape(c.name)+(c.prepared?' · prepared':'')+'</option>').join('')+'</select><input data-qty="'+i+'" type="number" step="any" min="0.001" value="'+r.qty+'" aria-label="Quantity '+(i+1)+'" '+(old?'disabled':'')+'><span>'+escape(r.uom)+'</span><button data-remove="'+i+'" aria-label="Remove ingredient '+(i+1)+'" '+(old?'disabled':'')+'>×</button></div>').join('');
    root.querySelectorAll('[data-row]').forEach(e=>e.onchange=()=>{const r=current.ingredients[Number(e.dataset.row)],c=current.catalog.find(x=>x.item===e.value);r.item=e.value;r.name=c?.name;r.uom=c?.uom||'';setDirty();ingredientRows()});
    root.querySelectorAll('[data-qty]').forEach(e=>e.oninput=()=>{current.ingredients[Number(e.dataset.qty)].qty=e.value;setDirty()});
    root.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{current.ingredients.splice(Number(e.dataset.remove),1);setDirty();ingredientRows()});
  }
  function recipeError(message){root.querySelector('#miRecipeError').innerHTML=message?'<div class="mi-error">'+escape(message)+'</div>':''}
  async function saveRecipe(){
    if(busy)return;busy=true;root.querySelector('#miSave').disabled=true;
    try{current=await call('save_recipe',{item_code:selected,ingredients:JSON.stringify(current.ingredients),expected_version:current.latest,...(current.kind==='prepared'?{output_qty:current.output_qty??1,recipe_note:current.recipe_note||''}:{})});dirty=false;data=await call('dashboard');editor();menuRows()}catch(e){recipeError(e.message)}finally{busy=false;root.querySelector('#miSave').disabled=false}
  }
  async function activateRecipe(){
    if(busy||dirty||!confirm(current.kind==='prepared'?'Activate this preparation recipe? Completed batches keep their original recipe.':'Activate this recipe for new orders? Existing orders keep their original recipe.'))return;
    busy=true;root.querySelector('#miActivate').disabled=true;
    try{current=await call('activate_recipe',{item_code:selected,version:current.version});data=await call('dashboard');editor();menuRows()}catch(e){recipeError(e.message)}finally{busy=false;root.querySelector('#miActivate').disabled=current.status!=='Draft'||dirty}
  }
  function openAudit(item){
    const r=data.stock.find(x=>x.item===item),d=document.getElementById('miAudit');
    d.className='mi mi-dialog mi-audit-short';
    d.innerHTML='<h2>Count stock</h2><p>'+escape(r.name)+'</p><div class="mi-audit-current"><span>In the system</span><strong>'+num(r.balance)+' '+escape(r.stock_uom)+'</strong></div><label for="miCount">How much did you count?</label><div class="mi-count-input"><input id="miCount" type="number" min="0" step="'+(r.stock_uom.toLowerCase()==='nos'?'1':'any')+'" inputmode="decimal" placeholder="'+num(r.balance)+'"><span>'+escape(r.stock_uom)+'</span></div><div class="mi-count-difference" id="miDiffSummary">The difference will appear here.</div><div id="miCostArea" hidden><label for="miCost">Unit cost · LKR per '+escape(r.stock_uom)+'</label><input id="miCost" type="number" min="0" step="any" inputmode="decimal"><p style="font-size:11px">Needed only when recording the first valued stock.</p></div><label for="miComment">Quick note</label><textarea id="miComment" rows="2" maxlength="1000" placeholder="Why is the count different?"></textarea><div class="mi-quick-notes"><button data-note="Physical stock count">Stock count</button><button data-note="Damaged or wasted stock removed">Wastage</button><button data-note="Difference found when receiving stock">Receiving difference</button></div><div id="miAuditError"></div><div class="mi-actions"><button class="mi-btn" id="miAuditCancel">Cancel</button><button class="mi-btn mi-primary" id="miAuditPost">Save count</button></div>';
    const input=d.querySelector('#miCount');input.oninput=()=>{const delta=Number(input.value)-r.balance;d.querySelector('#miDiffSummary').textContent=input.value===''?'The difference will appear here.':delta===0?'Matches the system — no correction needed.':(delta>0?'+':'')+num(delta)+' '+r.stock_uom+' will be recorded as a correction.';d.querySelector('#miCostArea').hidden=!(Number(input.value)>0&&!(Number(r.rate)>0))};
    d.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{d.querySelector('#miComment').value=b.dataset.note;d.querySelector('#miComment').focus()});
    d.querySelector('#miAuditCancel').onclick=()=>d.close();
    d.querySelector('#miAuditPost').onclick=async()=>{
      const button=d.querySelector('#miAuditPost');if(button.disabled)return;
      if(input.value===''||!Number.isFinite(Number(input.value))||Number(input.value)<0){d.querySelector('#miAuditError').innerHTML='<div class="mi-error">Enter a valid physical count.</div>';return}
      if(d.querySelector('#miComment').value.trim().length<3){d.querySelector('#miAuditError').innerHTML='<div class="mi-error">Add a quick note or choose a reason.</div>';d.querySelector('#miComment').focus();return}
      button.disabled=true;
      try{await call('correct_stock',{item_code:item,counted_qty:input.value,expected_qty:r.balance,comment:d.querySelector('#miComment').value,valuation_rate:d.querySelector('#miCost').value});d.close();await load();const notice=document.createElement('div');notice.className='mi-success';notice.textContent='Saved. '+r.name+': '+num(r.balance)+' → '+num(input.value)+' '+r.stock_uom;root.querySelector('#miContent').prepend(notice);setTimeout(()=>notice.remove(),6000)}catch(e){d.querySelector('#miAuditError').innerHTML='<div class="mi-error">'+escape(e.message)+'</div>'}finally{button.disabled=false}
    };
    d.showModal();input.focus();
  }
  function ruleOptions(mode,inherit=false){return (inherit?'<option value="inherit" '+(mode==='inherit'?'selected':'')+'>Use branch default</option>':'')+[['block','Block if stock is short'],['percent','Percentage tolerance'],['negative','Allow negative · no limit']].map(([value,label])=>'<option value="'+value+'" '+(mode===value?'selected':'')+'>'+label+'</option>').join('')}
  function rules(){
    const content=root.querySelector('#miContent');
    if(!data.stock_policy){content.innerHTML='<div class="mi-note">Stock rules are not available on this server yet.</div>';return}
    if(!policyDraft||policyBranch!==data.restaurant){policyDraft=JSON.parse(JSON.stringify(data.stock_policy));policyBranch=data.restaurant;policyDirty=false}
    content.innerHTML='<div class="mi-card"><h2>POS stock rules · '+escape(policyBranch)+'</h2><p>Choose how each ingredient behaves when a sale would take its recorded stock below zero.</p><div class="mi-note">Percentage tolerance uses this order’s saved recipe quantities, including portions and ingredient changes. The <strong>resulting negative balance</strong> must stay within that percentage. Existing negative stock counts toward the limit.<br>Example: 150 g chicken × 10% = a maximum balance of −15 g. Ten portions use 1,500 g, so the same 10% allows −150 g.</div><label for="miPolicyDefault">Branch default</label><div class="mi-fields" style="margin:8px 0 14px"><select id="miPolicyDefault" aria-label="Branch default stock rule">'+ruleOptions(policyDraft.default.mode)+'</select><input id="miPolicyPercent" type="number" min="0" max="100" step="any" aria-label="Branch default tolerance percent" style="width:90px" value="'+escape(policyDraft.default.percent)+'" '+(policyDraft.default.mode==='percent'?'':'disabled')+'><span>%</span></div><p>Ingredient rules below override this default. Unlisted and new ingredients use the branch default. These rules apply when sending POS orders; preparation batches still require their raw ingredients.</p><input id="miRuleSearch" class="mi-search" style="margin-top:18px" placeholder="Find an ingredient…" aria-label="Find stock rule" value="'+escape(ruleSearch)+'"><div id="miRuleRows"></div><div class="mi-actions"><button class="mi-btn" id="miReloadRules">Reload saved rules</button><button class="mi-btn mi-primary" id="miSaveRules">Save branch rules</button></div><p id="miRulesResult" role="status"></p></div><div class="mi-card" style="margin-top:20px"><h2>Recent sales with stock warnings</h2><p>Each sale keeps the rules and quantities used when it was sent.</p><div class="mi-history" style="margin-top:15px">'+(data.shortage_sales?.length?data.shortage_sales.map(s=>'<article><strong>'+escape(s.order)+'</strong><small>'+escape(s.creation)+' · Rules version '+escape(s.policy?.revision??'')+'</small>'+s.warnings.map(w=>'<p><strong style="display:inline;color:#ad392e">'+escape(w.name)+': '+num(w.after)+' '+escape(w.uom)+'</strong> · '+(w.mode==='negative'?'Negative stock allowed':num(w.percent)+'% tolerance · minus limit '+num(w.limit)+' '+escape(w.uom))+'</p>').join('')+'</article>').join(''):'<div class="mi-empty">No sales with stock warnings recorded.</div>')+'</div></div>';
    content.querySelector('#miPolicyDefault').onchange=e=>{policyDraft.default.mode=e.target.value;policyDirty=true;const input=content.querySelector('#miPolicyPercent');input.disabled=e.target.value!=='percent'};
    content.querySelector('#miPolicyPercent').oninput=e=>{policyDraft.default.percent=e.target.value;policyDirty=true};
    content.querySelector('#miRuleSearch').oninput=e=>{ruleSearch=e.target.value;ruleRows()};
    content.querySelector('#miReloadRules').onclick=async()=>{policyDraft=null;policyDirty=false;await load()};
    content.querySelector('#miSaveRules').onclick=async e=>{
      const button=e.target;button.disabled=true;
      try{const saved=await call('save_stock_policy',{restaurant:policyBranch,policy:JSON.stringify(policyDraft)});policyDraft=saved;policyDirty=false;await load(true);rules();root.querySelector('#miRulesResult').textContent='Saved for '+policyBranch+'. Earlier sales and stock balances are unchanged.'}
      catch(err){root.querySelector('#miRulesResult').textContent=err.message}
      finally{button.disabled=false}
    };
    ruleRows();
  }
  function ruleRows(){
    const target=root.querySelector('#miRuleRows'),q=ruleSearch.toLowerCase();
    const items=data.stock.filter(r=>(r.name+' '+r.item).toLowerCase().includes(q));
    target.innerHTML=items.map(r=>{const rule=policyDraft.items[r.item],mode=rule?.mode||'inherit';return '<div class="mi-rule-row" data-rule-item="'+escape(r.item)+'"><div><strong>'+escape(r.name)+'</strong><small style="display:block;color:var(--muted);margin-top:4px">'+num(r.balance)+' '+escape(r.stock_uom)+' remaining</small></div><select data-rule-mode="'+escape(r.item)+'" aria-label="Stock rule for '+escape(r.name)+'">'+ruleOptions(mode,true)+'</select><div class="mi-fields" style="flex-wrap:nowrap"><input data-rule-percent="'+escape(r.item)+'" aria-label="Tolerance percent for '+escape(r.name)+'" type="number" min="0" max="100" step="any" style="width:80px" value="'+escape(rule?.percent||0)+'" '+(mode==='percent'?'':'disabled')+'><span>%</span></div></div>'}).join('')||'<p>No matching ingredients.</p>';
    target.querySelectorAll('[data-rule-mode]').forEach(input=>input.onchange=()=>{const item=input.dataset.ruleMode;if(input.value==='inherit')delete policyDraft.items[item];else policyDraft.items[item]={mode:input.value,percent:policyDraft.items[item]?.percent||0};policyDirty=true;ruleRows()});
    target.querySelectorAll('[data-rule-percent]').forEach(input=>input.oninput=()=>{policyDraft.items[input.dataset.rulePercent].percent=input.value;policyDirty=true});
  }
  return {load};
})();
</script>
<style>.mi-rule-row{display:grid;grid-template-columns:minmax(160px,1fr) minmax(175px,1fr) 110px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.mi-tabs{flex-wrap:wrap}.mi-rule-row select{width:100%}@media(max-width:650px){.mi-rule-row{grid-template-columns:minmax(0,1fr) 100px;gap:9px}.mi-rule-row>div:first-child{grid-column:1/-1}}</style>
