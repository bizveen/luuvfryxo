{% include "frappe/www/app.html" %}

<script type="text/javascript">
/* ──────────────────────────────────────────────────────────────────────────
   /app2 router shim.

   frappe/public/js/frappe/router.js hardcodes the "/app" prefix in three
   places, so a desk served from anywhere else pushes /app/... URLs on the
   first click and falls straight back into the customer PWA. Rewrite those
   three to speak /app2.

   This tag is parsed after the desk bundles (which are plain blocking
   <script src>) and before DOMContentLoaded, which is when frappe.app boots —
   so frappe.router already exists, and nothing has routed yet.
   ────────────────────────────────────────────────────────────────────────── */
(function () {
	var BASE = "app2";
	var r = window.frappe && window.frappe.router;
	if (!r) return;

	// 1. strip_prefix(): only strips a leading "app"/"app/". Fold app2 -> app
	//    first, then let the original do the rest.
	var _strip_prefix = r.strip_prefix.bind(r);
	r.strip_prefix = function (route) {
		if (typeof route === "string") {
			route = route.replace(/^(\/?)app2(?=$|[\/#?])/, "$1app");
		}
		return _strip_prefix(route);
	};

	// 2. is_app_route(): decides whether a clicked <a> is handled by the router
	//    instead of a full page load. /app/... links rendered server-side (and
	//    by erpnext) must keep matching, or they navigate away to the PWA.
	var _is_app_route = r.is_app_route.bind(r);
	r.is_app_route = function (path) {
		if (!path) return;
		var head = (path.charAt(0) === "/" ? path.slice(1) : path).split("/")[0];
		if (head === BASE) return true;
		return _is_app_route(path);
	};

	// 3. make_url(): every route change ends up here, and it builds "/app/…".
	var _make_url = r.make_url.bind(r);
	r.make_url = function () {
		return _make_url.apply(null, arguments).replace(/^\/app(?=$|\/)/, "/" + BASE);
	};
})();
</script>
