<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luuv Fryxo · Purchasing</title><style>
body{margin:0;background:#faf7f2;font-family:system-ui;color:#24201c}.local{background:#2d2925;color:#fff;padding:10px 5%;font-size:12px}.local b{color:#ffc68f}header{background:#fff;border-bottom:1px solid #e8e1d9;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}header strong{font-size:20px}header strong span{color:#ed570e}header a{color:#b64e1e;text-decoration:none;font-size:13px}main{max-width:1100px;margin:30px auto;padding:0 22px}.p-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.p-summary div{background:#fff;border:1px solid #e8e1d9;border-radius:14px;padding:18px}.p-summary strong{font-size:25px;display:block;margin-top:7px}.p-orders{display:grid;gap:16px}.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.p-top h2{margin-bottom:5px}.p-lines{margin:16px 0}.p-line{display:grid;grid-template-columns:minmax(120px,1fr) 150px 150px;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.p-line span:nth-child(n+2){text-align:right;color:#80776f}.p-low{border:1px solid #ecc1b9;background:#fff5ef;border-radius:14px;padding:18px;margin-bottom:24px}.p-low p{font-size:12px}.p-new-line{display:grid;grid-template-columns:minmax(100px,1fr) 90px 35px 28px;align-items:center;gap:8px;margin:10px 0}.p-new-line input,.p-new-line select{width:100%;min-width:0}.p-new-line button{border:0;background:none;font-size:20px;color:#a83e30}.p-receive-row{border-top:1px solid #e8e1d9;margin-top:15px;padding-top:15px}.p-receive-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.p-receive-fields label{font-size:11px}.p-receipt{border-top:1px solid #e8e1d9;padding:13px 0;margin-top:10px}.p-receipt p{font-size:12px}.p-pending{color:#9c6b16;background:#fff2d8}.p-partial{color:#7e5618;background:#fff2d8}.mi-dialog select{max-width:100%}.mi a{text-decoration:none}.mi-dialog .mi-fields label{margin:0}.p-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:650px){main{padding:0 15px}.p-summary{gap:7px}.p-summary div{padding:12px;font-size:11px}.p-summary strong{font-size:22px}.p-line{grid-template-columns:minmax(90px,1fr) 85px 85px;font-size:12px}.p-top{flex-wrap:wrap}.p-new-line{grid-template-columns:minmax(110px,1fr) 65px 25px 24px;gap:5px}.mi-head{flex-wrap:wrap}.mi-dialog{padding:18px}.p-receive-fields{gap:8px}}
</style></head><body><div class="local"><b>LOCAL REVIEW</b> · Separate test data · No supplier orders or payments are sent</div><header><strong><span>luuv</span> fryxo <small style="color:#80776f;font-size:12px">PURCHASING</small></strong><a href="/manager?view=piles">Manager inventory ↗</a></header>
<main class="mi"><div class="mi-head"><div><h1>Purchasing</h1><p>Kurunegala · Order, receive, restock.</p></div><button class="mi-btn mi-primary" id="pNew">+ New purchase</button></div><div id="pError" role="alert"></div><div id="pLow"></div><div id="pSummary" class="p-summary"></div><h2 style="margin-bottom:16px">Purchase requests</h2><div id="pOrders" class="p-orders"></div></main><dialog id="pDialog" class="mi mi-dialog"></dialog>__COMPONENT__<script>
const api='/api/method/luuvcrm.api.manager_inventory.',dialog=document.getElementById('pDialog');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:4});
let data,orders=[],draft=[],working=false,loading=false,refreshAgain=false;
async function call(m,p={}){const r=await fetch(api+m,{method:'POST',body:new URLSearchParams(p)});const d=await r.json();if(!r.ok)throw Error(d.error);return d.message}
function error(message){document.getElementById('pError').innerHTML=message?'<div class="mi-error">'+esc(message)+'</div>':''}
async function load(){if(loading){refreshAgain=true;return}loading=true;try{const next=await Promise.all([call('dashboard'),call('purchases')]);data=next[0];orders=next[1].orders;render();error('')}catch(e){error(e.message)}finally{loading=false;if(refreshAgain){refreshAgain=false;queueMicrotask(load)}}}
const lowItems=()=>data.stock.filter(r=>!r.prepared&&Number(r.minimum_qty)>0&&Number(r.balance)<=Number(r.minimum_qty));
function render(){
  const low=lowItems();document.getElementById('pLow').innerHTML=low.length?'<section class="p-low"><div class="p-top"><div><h2>'+low.length+' items at or below minimum</h2><p>'+low.map(r=>esc(r.name)+' · '+num(r.balance)+' '+esc(r.stock_uom)+(r.on_order?' ('+num(r.on_order)+' on order)':'')).join(' &nbsp; / &nbsp; ')+'</p></div><button class="mi-btn" id="pFromLow">Use low-stock list</button></div><p style="margin-top:9px">Suggested quantities cover the gap to MOQ, after pending orders. Adjust them for your next delivery.</p></section>':'';
  if(low.length)document.getElementById('pFromLow').onclick=()=>openPurchase(true);
  document.getElementById('pSummary').innerHTML=[['Pending delivery',orders.filter(o=>o.status==='pending').length],['Part received',orders.filter(o=>o.status==='partial').length],['Received',orders.filter(o=>o.status==='received').length]].map(([label,n])=>'<div>'+label+'<strong>'+n+'</strong></div>').join('');
  const statuses={pending:'Pending delivery',partial:'Part received',received:'Received',cancelled:'Cancelled'};
  document.getElementById('pOrders').innerHTML=orders.map(o=>'<article class="mi-card" data-purchase="'+esc(o.name)+'"><div class="p-top"><div><h2>'+esc(o.vendor)+'</h2><p>'+esc(o.name)+' · '+(o.source==='central_kitchen'?'Central Kitchen':'Supplier')+'</p></div><span class="mi-pill '+(o.status==='received'?'green':'p-'+o.status)+'">'+statuses[o.status]+'</span></div><div class="p-lines">'+o.items.map(i=>'<div class="p-line"><strong>'+esc(i.name)+'</strong><span>Ordered '+num(i.qty)+' '+esc(i.uom)+'</span><span>Received '+num(i.received_qty)+' '+esc(i.uom)+'</span></div>').join('')+'</div>'+(o.note?'<p>'+esc(o.note)+'</p>':'')+(o.cancelled_at?'<p>Cancelled remainder: '+esc(o.cancel_note)+'</p>':'')+'<p style="font-size:11px">Recorded '+esc(new Date(o.creation).toLocaleString())+'</p>'+(['pending','partial'].includes(o.status)?'<div class="p-actions"><button class="mi-btn mi-primary" data-receive="'+esc(o.name)+'">Receive stock</button><button class="mi-btn" data-cancel="'+esc(o.name)+'">Cancel remaining</button></div>':'')+(o.receipts.length?'<details style="margin-top:18px"><summary style="cursor:pointer">Receipts · '+o.receipts.length+'</summary>'+o.receipts.map(r=>'<div class="p-receipt"><strong>'+esc(r.details.bill_ref)+' · LKR '+num(r.details.total)+'</strong><p>'+esc(r.name)+' · '+esc(new Date(r.creation).toLocaleString())+'</p>'+r.details.items.map(i=>'<p>'+esc(i.name)+' +'+num(i.qty)+' '+esc(i.uom)+' · LKR '+num(i.rate)+' / '+esc(i.uom)+'</p>').join('')+(r.details.note?'<p>'+esc(r.details.note)+'</p>':'')+'</div>').join('')+'</details>':'')+'</article>').join('')||'<div class="mi-card mi-empty">No purchases recorded yet. Start with the low-stock list or add an item.</div>';
  document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>openReceipt(orders.find(o=>o.name===b.dataset.receive)));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>openCancel(orders.find(o=>o.name===b.dataset.cancel)));
}
function close(){if(!working)dialog.close()}
dialog.addEventListener('cancel',e=>{if(working)e.preventDefault()});
function footer(label){return '<div id="pFormError" role="alert"></div><div class="mi-actions"><button class="mi-btn" id="pClose">Cancel</button><button class="mi-btn mi-primary" id="pSave">'+label+'</button></div>'}
async function save(action){if(working)return;working=true;dialog.querySelector('#pSave').disabled=true;dialog.querySelector('#pFormError').innerHTML='';try{await action();dialog.close();await load()}catch(e){dialog.querySelector('#pFormError').innerHTML='<div class="mi-error">'+esc(e.message)+'</div>'}finally{working=false;dialog.querySelector('#pSave').disabled=false}}
function openPurchase(fromLow=false){
  const key=crypto.randomUUID();draft=fromLow?lowItems().filter(r=>!r.on_order||r.minimum_qty-r.balance-r.on_order>0).map(r=>({item:r.item,qty:Math.max(0,Number((r.minimum_qty-r.balance-r.on_order).toFixed(6)))||''})):[{item:'',qty:''}];
  dialog.innerHTML='<h2>New purchase request</h2><p>Record the order here, then arrange delivery with your supplier. Stock increases only after receiving.</p><label for="pSource">Buy from</label><select id="pSource" style="width:100%"><option value="supplier">Supplier</option><option value="central_kitchen">Central Kitchen</option></select><label for="pVendor">Supplier / kitchen name</label><input id="pVendor" maxlength="120" placeholder="Enter supplier name"><div id="pDraft" style="margin-top:18px"></div><button class="mi-btn" id="pAdd">+ Add item</button><p style="font-size:12px;margin-top:10px">Quantities use the stock unit. Prepared salad is made through Recipes.</p><label for="pNote">Note (optional)</label><textarea id="pNote" rows="2" maxlength="1000"></textarea>'+footer('Save pending order');
  renderDraft();dialog.querySelector('#pAdd').onclick=()=>{draft.push({item:'',qty:''});renderDraft()};dialog.querySelector('#pClose').onclick=close;
  dialog.querySelector('#pSource').onchange=e=>{if(e.target.value==='central_kitchen'&&!dialog.querySelector('#pVendor').value)dialog.querySelector('#pVendor').value='Central Kitchen'};
  dialog.querySelector('#pSave').onclick=()=>save(()=>call('save_purchase',{request_id:key,vendor:dialog.querySelector('#pVendor').value,source:dialog.querySelector('#pSource').value,note:dialog.querySelector('#pNote').value,items:JSON.stringify(draft)}));dialog.showModal();
}
function renderDraft(){
  dialog.querySelector('#pDraft').innerHTML=draft.map((r,index)=>{const stock=data.stock.find(i=>i.item===r.item);return '<div class="p-new-line"><select data-item="'+index+'" aria-label="Purchase item '+(index+1)+'"><option value="">Choose item</option>'+data.stock.filter(i=>!i.prepared).map(i=>'<option value="'+esc(i.item)+'" '+(i.item===r.item?'selected':'')+'>'+esc(i.name)+'</option>').join('')+'</select><input type="number" min="0.000001" step="'+(stock?.stock_uom==='nos'?'1':'any')+'" data-qty="'+index+'" aria-label="Order quantity '+(index+1)+'" value="'+esc(r.qty)+'"><span>'+esc(stock?.stock_uom||'')+'</span><button data-remove="'+index+'" aria-label="Remove item '+(index+1)+'">×</button></div>'}).join('')||'<p>Low stock is covered by pending orders. Add another item if needed.</p>';
  dialog.querySelectorAll('[data-item]').forEach(e=>e.onchange=()=>{draft[Number(e.dataset.item)].item=e.value;renderDraft()});dialog.querySelectorAll('[data-qty]').forEach(e=>e.oninput=()=>{draft[Number(e.dataset.qty)].qty=e.value});dialog.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{draft.splice(Number(e.dataset.remove),1);renderDraft()});
}
function openReceipt(order){
  const key=crypto.randomUUID(),remaining=order.items.filter(i=>i.remaining_qty>0);
  dialog.innerHTML='<h2>Receive stock</h2><p>'+esc(order.vendor)+' · '+esc(order.name)+'</p><div class="mi-note">Enter only goods physically received. Use 0 for items not delivered yet; the rest stays pending.</div><label for="pBillRef">Bill / delivery reference</label><input id="pBillRef" maxlength="120" placeholder="e.g. INV-105 or DELIVERY-2">'+remaining.map((i,index)=>'<div class="p-receive-row"><strong>'+esc(i.name)+'</strong><p style="font-size:12px">Remaining '+num(i.remaining_qty)+' '+esc(i.uom)+'</p><div class="p-receive-fields"><div><label for="pReceived'+index+'">Received ('+esc(i.uom)+')</label><input id="pReceived'+index+'" type="number" min="0" max="'+i.remaining_qty+'" step="'+(i.uom==='nos'?'1':'any')+'" value="'+i.remaining_qty+'"></div><div><label for="pRate'+index+'">Actual cost · LKR / '+esc(i.uom)+'</label><input id="pRate'+index+'" type="number" min="0" step="any" placeholder="Unit price"></div></div></div>').join('')+'<label for="pReceiptNote">Receiving note (optional)</label><textarea id="pReceiptNote" rows="2" maxlength="1000"></textarea>'+footer('Receive & update stock');
  dialog.querySelector('#pClose').onclick=close;dialog.querySelector('#pSave').onclick=()=>save(()=>{
    const items=remaining.map((i,index)=>({item:i.item,qty:dialog.querySelector('#pReceived'+index).value,rate:dialog.querySelector('#pRate'+index).value})).filter(i=>i.qty===''||Number(i.qty)!==0);
    return call('receive_purchase',{purchase:order.name,request_id:key,bill_ref:dialog.querySelector('#pBillRef').value,note:dialog.querySelector('#pReceiptNote').value,items:JSON.stringify(items)});
  });dialog.showModal();
}
function openCancel(order){dialog.innerHTML='<h2>Cancel remaining delivery</h2><p>'+esc(order.name)+' · Already received stock stays unchanged.</p><label for="pCancelNote">Reason</label><textarea id="pCancelNote" rows="2" maxlength="1000"></textarea>'+footer('Cancel remaining');dialog.querySelector('#pClose').onclick=close;dialog.querySelector('#pSave').onclick=()=>save(()=>call('cancel_purchase',{purchase:order.name,comment:dialog.querySelector('#pCancelNote').value}));dialog.showModal()}
document.getElementById('pNew').onclick=()=>openPurchase();
(async()=>{await load();if(data&&new URLSearchParams(location.search).get('low')==='1')openPurchase(true);const stream=new EventSource('/events/stock');stream.addEventListener('stock',load);stream.addEventListener('ready',load);window.addEventListener('pagehide',()=>stream.close());setInterval(()=>{if(!document.hidden)load()},15000)})();
</script></body></html>
